{% extends "admin/base.html" %}{% block title %}Candidates{% endblock %}{% block heading %}Candidates{% endblock %}{% block content %}<div class="welcome"><a href="{{ url_for('add_candidate') }}" class="btn">+ Add Candidate</a><table><tr><th>Photo</th><th>Name</th><th>Position</th><th>Action</th></tr>{% for candidate in candidates %}<tr><td><img src="{{ url_for('static', filename='uploads/' + (candidate.photo or 'default.png')) }}" width="60"></td><td>{{ candidate.fullname }}</td><td>{{ candidate.position }}</td><td><a href="{{ url_for('edit_candidate',id=candidate.id) }}">Edit</a> <a href="{{ url_for('delete_candidate',id=candidate.id) }}" onclick="return confirm('Delete this candidate?')">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}

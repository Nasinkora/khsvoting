{% extends "admin/base.html" %}{% block title %}Positions{% endblock %}{% block heading %}Election Positions{% endblock %}{% block content %}<div class="welcome"><form action="{{ url_for('positions') }}" method="POST"><input type="text" name="position" placeholder="Enter Position" required><button type="submit" class="btn">Add Position</button></form><br><table><tr><th>ID</th><th>Position</th><th>Action</th></tr>{% for position in positions %}<tr><td>{{ position.id }}</td><td>{{ position.position_name }}</td><td><a href="{{ url_for('delete_position',id=position.id) }}" onclick="return confirm('Delete this position and its candidates?')">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}
